name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned by rust-toolchain.toml; this action honours it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # plexos-types encodes formats that ship to devices and can never be changed.
      # A compile warning here is a format bug in waiting.
      #
      # RUSTDOCFLAGS is set here and not in the job's `env`, because the `RUSTFLAGS` there
      # is read by rustc and never by rustdoc — so for the life of this file the step was
      # called "Documentation builds clean" and tolerated whatever rustdoc had to say. It
      # had accumulated nineteen warnings, all of them broken intra-doc links, and the name
      # of the step is the reason nobody looked. A check that cannot fail is worse than no
      # check, because it is counted.
      - name: Documentation builds clean
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
