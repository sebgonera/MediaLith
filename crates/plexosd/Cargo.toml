[package]
name = "plexosd"
version = "0.1.0"
description = "Management daemon: the boot health gate, and the rollback counter"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
# The status console reports the GPU verdict, so it calls the diagnostic as a library
# rather than shelling out to the binary and parsing it back. It also brings the
# `Environment` trait, which is what makes the network module testable without a NIC.
plexos-gpu = { path = "../plexos-gpu" }
# Mounting the Plex app image at boot (ADR-0007). plexosd is what plexos-init runs,
# so this is where the verified-mount path becomes reachable from a booting machine.
plexos-plex = { path = "../plexos-plex" }
plexos-sys = { path = "../plexos-sys" }
plexos-types = { path = "../plexos-types" }
# Replacing /usr over the network: the slot decision, the writer, the bundle format.
plexos-update = { path = "../plexos-update" }
qrcode = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

[lints]
workspace = true
