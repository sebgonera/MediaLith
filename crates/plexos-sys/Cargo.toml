[package]
name = "plexos-sys"
version = "0.1.0"
description = "The audited unsafe surface: device-mapper ioctls and mount syscalls"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# For the frozen Plex uid, so the drop target and the account the image creates
# cannot disagree.
plexos-types = { path = "../plexos-types" }
# Declarations only. The symbols are in the libc that std already links, so on a
# +crt-static build this adds nothing that was not there before.
libc = "0.2"

[lints.rust]
missing_docs = "warn"
# Deliberately NOT the workspace lints. Every other crate forbids unsafe_code; this
# one exists so that they can. See the crate documentation for what that buys and
# what it costs.
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Every unsafe block in this crate must justify itself in a comment.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
