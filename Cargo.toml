[workspace]
resolver = "3"
members = [
    "crates/plexos-gpu",
    "crates/plexos-init",
    "crates/plexos-plex",
    "crates/plexos-sys",
    "crates/plexos-types",
    "crates/plexos-update",
    "crates/plexosd",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/sebgonera/OS"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# SHA-256 for the console's device token (ADR-0013). A dependency rather than a
# hand-written hash: this is the one place in the workspace where a subtle mistake is
# both silent and security-relevant. RustCrypto, pure Rust, no unsafe.
sha2 = { version = "0.10", default-features = false }
# TLS for the console (ADR-0014). rustls rather than the OpenSSL already in the image,
# and the reason is the build rather than a preference: plexosd is a static binary built
# with the workspace's own toolchain, linking nothing from Buildroot's sysroot, and its
# install step refuses a dynamic one. Pure Rust keeps that true. `ring` is the backend
# because the target triple is the host's, so it compiles like any other host build.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# The appliance issues its own certificate. There is no CA, no domain name, and -- found
# while planning this -- no `openssl` binary in the image either, only the libraries curl
# links. So the certificate has to be made in process.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# QR encoding for the appliance dashboard's pairing screen (ADR-0019). A dependency for
# the same reason sha2 is one: ISO/IEC 18004 is Reed-Solomon over GF(256), eight mask
# patterns scored against four penalty rules, and a version table -- and a subtle mistake
# in any of it produces a symbol that looks perfectly plausible and does not scan.
#
# `default-features = false` is the whole of the audit: the defaults pull `image` for PNG
# output, and without them this crate has **no dependencies at all**. Rendering is ours
# anyway -- the terminal wants cells, not pixels.
qrcode = { version = "0.14", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
