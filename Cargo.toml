[workspace]
resolver = "3"
members = ["crates/plexos-gpu", "crates/plexos-init", "crates/plexos-sys", "crates/plexosd", "crates/plexos-types"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/sebgonera/OS"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
